# Live prices from an OpenFNO platform running on the same machine.
#
# The broker reads the platform's Redis tick stream (`market:ticks`) for its
# quotes. That Redis is published on the host's loopback only, so the broker
# joins the platform's own Docker network and reaches it by container name
# instead:
#
#   BROKER_REDIS=algotrading_redis:6379 \
#     docker compose -f docker-compose.yml -f docker-compose.platform.yml up -d
#
# Without this file the broker runs on its own: quotes are set by hand through
# PUT /admin/quotes, or generated by the sandbox's market simulator.
services:
  broker:
    networks:
      - default
      - platform

networks:
  platform:
    external: true
    name: algotrading_default
